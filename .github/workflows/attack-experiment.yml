name: 자동 실험

# 공격문을 도 씨에게 그대로 넣어 지시문과 검사에 따른 암호 유출률을 잰다. 조건 하나에 Gemini를 한 번 부른다.
# experiments/trigger/experiment.txt 를 고쳐 올리면 그 파일의 줄마다 한 번씩 실행한다. 줄은 run_experiment.py의 옵션이다.
on:
  workflow_dispatch:
    inputs:
      args:
        description: run_experiment.py 옵션 (예 --set ko --conds NAB)
        default: "--set en --conds GAB --n 100"
  push:
    branches: [main]
    paths:
      - experiments/trigger/experiment.txt

permissions:
  contents: write

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: 실험
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
          MANUAL_ARGS: ${{ github.event.inputs.args }}
        run: |
          if [ -n "$MANUAL_ARGS" ]; then
            python experiments/run_experiment.py $MANUAL_ARGS
          else
            # '#'으로 시작하지 않는 줄을 옵션으로 보고 차례로 실행한다. 허용한 글자만 통과시킨다
            grep -v '^#' experiments/trigger/experiment.txt | grep -E '^[-A-Za-z0-9 .]+$' | while read -r line; do
              [ -z "$line" ] && continue
              echo "== $line"
              python experiments/run_experiment.py $line || true
            done
          fi
      - name: 결과를 저장소에 기록
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "자동 실험 결과 기록"
          git pull --rebase origin main
          git push
