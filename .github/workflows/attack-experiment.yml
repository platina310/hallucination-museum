name: 자동 실험

# 공격문 표본을 도 씨에게 그대로 넣어 지시문 세 가지와 검사의 암호 유출률을 잰다. 한 건에 Gemini를 세 번 부른다.
on:
  workflow_dispatch:
    inputs:
      n:
        description: 이번에 실험할 공격문 수 (무료 등급은 100 이하 권장)
        default: "100"
  push:
    branches: [main]
    paths:
      - experiments/trigger/experiment.txt

permissions:
  contents: write

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: 실험
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python experiments/run_experiment.py --n "${{ github.event.inputs.n || '100' }}"
      - name: 결과를 저장소에 기록
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "자동 실험 결과 기록"
          git pull --rebase origin main
          git push
