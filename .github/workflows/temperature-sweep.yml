name: 온도 점검

# temperature가 실제로 답의 다양성을 바꾸는지 모델별로 잰다. experiments/trigger/temperature.txt 를 고쳐 올리면 실행한다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - experiments/trigger/temperature.txt

permissions:
  contents: write

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: 측정
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          # 주석이 아닌 첫 줄로 한 번 실행한다. 줄은 "이름표 [모델,모델] [온도,온도] [횟수] [질문,질문]". 허용한 글자만 통과시킨다
          line=$(grep -v '^#' experiments/trigger/temperature.txt | grep -E '^[-A-Za-z0-9._, ]+$' | head -1)
          python experiments/temperature_sweep.py ${line:-sweep}
      - name: 결과를 저장소에 기록
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "온도 점검 결과 기록"
          git pull --rebase origin main
          git push
